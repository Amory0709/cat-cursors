name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CATCURSOR_REQUIRE_SOURCES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mac/requirements.txt
      - name: Unit, installer and real-source regression tests
        run: python -m unittest discover -s tests -v
      - name: Build complete ZIP
        if: runner.os != 'macOS'
        run: python scripts/build_release.py --version candidate-${{ github.sha }}
      - name: Build ZIP and DMG from one manifest
        if: runner.os == 'macOS'
        run: python scripts/build_release.py --version candidate-${{ github.sha }} --dmg
      - name: Native macOS image decoding
        if: runner.os == 'macOS'
        run: swift mac/verify_cape.swift mac/dist/Cat-Cursor.cape
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Cat-Cursor-macOS-candidate
          path: |
            dist/Cat-Cursor-macOS-*.zip
            dist/Cat-Cursor-Installer.dmg
            mac/dist/Cat-Cursor.cape
          if-no-files-found: error
