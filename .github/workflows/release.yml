name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r mac/requirements.txt

      - name: Build cape theme
        run: python3 mac/build_cape.py --output mac/dist/Cat-Cursor.cape

      - name: Build DMG installer
        run: |
          chmod +x mac/package/build_dmg.sh
          mac/package/build_dmg.sh

      - name: Build ZIP installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="dist/Cat-Cursor-macOS"
          mkdir -p "$STAGE/lib"
          cp mac/dist/Cat-Cursor.cape "$STAGE/Cat-Cursor.cape"
          cp "mac/package/Install Cat Cursor.command" "$STAGE/"
          cp mac/lib/install_core.sh "$STAGE/lib/"
          cp mac/package/README.txt "$STAGE/"
          chmod +x "$STAGE/Install Cat Cursor.command" "$STAGE/lib/install_core.sh"
          cd dist && zip -r "Cat-Cursor-macOS-v${VERSION}.zip" Cat-Cursor-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cat-Cursor-macOS-v*.zip
            mac/dist/Cat-Cursor-Installer.dmg
            mac/dist/Cat-Cursor.cape
          generate_release_notes: true
