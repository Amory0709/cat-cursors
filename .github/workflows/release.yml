name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    env:
      CATCURSOR_REQUIRE_SOURCES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mac/requirements.txt
      - name: Regression tests including real artwork
        run: python -m unittest discover -s tests -v
      - name: Build ZIP and DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --version "${RELEASE_TAG#v}" --dmg
      - name: Native AppKit validation
        run: swift mac/verify_cape.swift mac/dist/Cat-Cursor.cape
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cat-Cursor-macOS-*.zip
            dist/Cat-Cursor-Installer.dmg
            mac/dist/Cat-Cursor.cape
          fail_on_unmatched_files: true
          generate_release_notes: true
